name: build-deploy
on: { push: { branches: [main] } }
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { creds: "${{ secrets.AZURE_CREDENTIALS }}" }
      - run: az acr login -n <acr>
      - run: |
          docker build -t <acr>.azurecr.io/myapp:${{ github.sha }} .
          docker push <acr>.azurecr.io/myapp:${{ github.sha }}
      - uses: azure/aks-set-context@v4
        with: { resource-group: <rg>, cluster-name: cluster-pet }
      - run: |
          helm upgrade --install myapp ./helm/myapp \
            --set image.repository=<acr>.azurecr.io/myapp \
            --set image.tag=${{ github.sha }} -n app --create-namespace

